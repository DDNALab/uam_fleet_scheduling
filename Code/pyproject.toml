[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coord-schedule-uam"
version = "0.1.0"
description = "Risk-aware stochastic demand and coordinated charging/scheduling for urban air mobility."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "folium>=0.15",
  "geopandas>=0.14",
  "highspy>=1.7",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "plotly>=5.18",
  "pulp>=2.8",
  "scipy>=1.11",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
coord-schedule-uam = "coord_schedule_uam.experiment_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

